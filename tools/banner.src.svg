<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
<style>
/*FONTS*/
text { font-family: 'LM', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
.b { font-weight: 700; }
.cursor { animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.say { opacity: 0; animation: say 16s infinite; }
.say:first-of-type { opacity: 1; }
.say:nth-of-type(2) { animation-delay: 4s; }
.say:nth-of-type(3) { animation-delay: 8s; }
.say:nth-of-type(4) { animation-delay: 12s; }
@keyframes say { 0% { opacity: 0; transform: translateY(8px); } 3%, 22% { opacity: 1; transform: none; } 25%, 100% { opacity: 0; } }
.row { animation: in .5s ease-out backwards; }
@keyframes in { from { opacity: 0; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .cursor, .say, .row { animation: none; opacity: 1; } .say ~ .say { display: none; } }
</style>
<rect width="1200" height="400" fill="#111513"/>
<rect x="1" y="1" width="1198" height="398" fill="none" stroke="#303a32" stroke-width="2"/>

<text x="60" y="78" font-size="28" class="b" fill="#eef0e8">lefteros<tspan class="cursor" fill="#c2f66d">_</tspan></text>
<text x="60" y="142" font-size="15" letter-spacing="4" fill="#a3afa5">LEFTERIS ILIADIS · SOMNIUSX · GREECE</text>
<text x="60" y="205" font-size="44" class="b" fill="#eef0e8">ERP, servers and Linux,</text>
<text x="60" y="258" font-size="44" class="b" fill="#eef0e8">down to the firmware.</text>

<g font-size="19" fill="#a3afa5">
  <text class="say" x="60" y="312"><tspan fill="#c2f66d">$</tspan> local AI that stays on your machine</text>
  <text class="say" x="60" y="312"><tspan fill="#c2f66d">$</tspan> plugins for the Omarchy bar</text>
  <text class="say" x="60" y="312"><tspan fill="#c2f66d">$</tspan> twenty years of ERP and infrastructure</text>
  <text class="say" x="60" y="312"><tspan fill="#c2f66d">$</tspan> guides in Greek, since the Hackintosh days</text>
</g>
<rect x="60" y="344" width="120" height="6" fill="#c2f66d"/>

<rect x="730" y="46" width="420" height="308" fill="#161b18" stroke="#303a32" stroke-width="2"/>
<g font-size="17">
  <text x="756" y="88" class="b"><tspan fill="#c2f66d">somnius</tspan><tspan fill="#a3afa5">@</tspan><tspan fill="#eef0e8">lefteros</tspan></text>
  <text x="756" y="112" fill="#303a32">────────────────</text>
  <g fill="#eef0e8">
    <text class="row" style="animation-delay:.2s" x="756" y="142"><tspan fill="#c2f66d">OS</tspan><tspan x="830">Arch · Omarchy · NixOS</tspan></text>
    <text class="row" style="animation-delay:.4s" x="756" y="170"><tspan fill="#c2f66d">Since</tspan><tspan x="830">Red Hat, 1997</tspan></text>
    <text class="row" style="animation-delay:.6s" x="756" y="198"><tspan fill="#c2f66d">Code</tspan><tspan x="830">Bash · Python · QML · Rust</tspan></text>
    <text class="row" style="animation-delay:.8s" x="756" y="226"><tspan fill="#c2f66d">ERP</tspan><tspan x="830">Semantic · Cubit · Soft1</tspan></text>
    <text class="row" style="animation-delay:1s" x="756" y="254"><tspan fill="#c2f66d">Infra</tspan><tspan x="830">Proxmox · KVM · Docker</tspan></text>
    <text class="row" style="animation-delay:1.2s" x="756" y="282"><tspan fill="#c2f66d">Home</tspan><tspan x="830">lefteros.com</tspan></text>
  </g>
  <g class="row" style="animation-delay:1.4s">
    <rect x="756" y="306" width="26" height="18" fill="#111513" stroke="#303a32"/>
    <rect x="786" y="306" width="26" height="18" fill="#e06c75"/>
    <rect x="816" y="306" width="26" height="18" fill="#c2f66d"/>
    <rect x="846" y="306" width="26" height="18" fill="#e5c07b"/>
    <rect x="876" y="306" width="26" height="18" fill="#61afef"/>
    <rect x="906" y="306" width="26" height="18" fill="#c678dd"/>
    <rect x="936" y="306" width="26" height="18" fill="#56b6c2"/>
    <rect x="966" y="306" width="26" height="18" fill="#eef0e8"/>
  </g>
</g>
</svg>
